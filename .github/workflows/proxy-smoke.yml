name: "Proxy smoke test"

# Lightweight runtime check of the Apache reverse-proxy in front of sogod
# (login redirect, ActiveSync, CalDAV/CardDAV). Runs automatically after the
# image is published, and can be re-run on demand from the Actions tab.
#
# The image reference is NOT hardcoded: module-info.yml resolves the same
# owner/name/tag the publish pipeline used (branch- or version-derived),
# exactly like test-module.yml. A manual run may override the image.
on:
  workflow_run:
    workflows: ["Publish images"]
    types: [completed]
  workflow_dispatch:
    inputs:
      image:
        description: "Override image to smoke test (leave empty to use the published branch/version tag)"
        required: false
        default: ""

permissions:
  contents: read
  packages: read

jobs:
  module:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    uses: NethServer/ns8-github-actions/.github/workflows/module-info.yml@main

  smoke:
    needs: module
    runs-on: ubuntu-latest
    steps:
      # Check out the exact commit that was built/published (module-info.yml
      # resolves it from the workflow_run context), so the test script matches
      # the image under test - not whatever is on the default branch.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.module.outputs.sha }}

      - name: Resolve image reference
        id: img
        run: |
          override="${{ github.event.inputs.image }}"
          if [ -n "$override" ]; then
            ref="$override"
          else
            ref="ghcr.io/${{ needs.module.outputs.owner }}/${{ needs.module.outputs.name }}:${{ needs.module.outputs.tag }}"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Smoke testing: $ref"

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run reverse-proxy smoke test
        run: ./tests/proxy-smoke.sh "${{ steps.img.outputs.ref }}"
