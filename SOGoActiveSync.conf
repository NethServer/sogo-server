#
# Microsoft ActiveSync (EAS) reverse-proxy for SOGo.
#
# This drop-in is maintained in this repository (not patched into the upstream
# SOGo.conf) and is loaded by httpd.conf right after conf/extra/SOGo.conf.
# /Microsoft-Server-ActiveSync is a distinct path from /SOGo, so include order
# does not matter for correctness.
#
# The long timeouts are EAS-specific: ActiveSync uses long-lived "Ping"
# requests that must not be cut by the proxy. Note that you MUST run several
# sogod workers (SxVMemLimit / WOWorkersCount in sogo.conf) for ActiveSync.

ProxyPass /Microsoft-Server-ActiveSync \
    http://127.0.0.1:20000/SOGo/Microsoft-Server-ActiveSync \
    retry=60 connectiontimeout=5 timeout=360

<Proxy http://127.0.0.1:20000/SOGo/Microsoft-Server-ActiveSync>
    SetEnv proxy-nokeepalive 1
    SetEnv proxy-initial-not-pooled 1
</Proxy>
